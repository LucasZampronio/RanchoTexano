<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rancho Texano Avaliações</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --pos:#2a78d6; --neg:#eb6834;
  --good:#006300; --bad:#d03b3b; --warn:#fab219;
  --chip:#f0efec;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --pos:#3987e5; --neg:#d95926;
    --good:#0ca30c; --bad:#e66767; --chip:#2c2c2a;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --pos:#3987e5; --neg:#d95926;
  --good:#0ca30c; --bad:#e66767; --chip:#2c2c2a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header{margin-bottom:14px}
h1{font-size:22px;margin:0 0 2px;line-height:1.2}
.sub{color:var(--ink2);font-size:13px}
.aviso{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:8px;background:var(--chip);color:var(--ink2);font-size:12px}
.filtros{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:10px 12px;margin-bottom:16px;position:sticky;top:0;z-index:5}
.fg{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:transparent;color:var(--ink2);padding:6px 12px;border-radius:6px;font:inherit;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--ring)}
select,input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:6px 8px;max-width:100%}
.lbl{color:var(--muted);font-size:12px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .k{color:var(--ink2);font-size:12px}
.kpi .v{font-size:28px;font-weight:650;margin-top:2px;line-height:1.2}
.kpi .d{font-size:12px;color:var(--muted);margin-top:4px}
.up-good{color:var(--good)} .up-bad{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.full{margin-bottom:12px}
h2{font-size:15px;margin:0 0 2px}
h3{font-size:13px;margin:0 0 6px;color:var(--ink2);font-weight:600}
.cap{color:var(--muted);font-size:12px;margin-bottom:8px}
.analise{display:grid;grid-template-columns:3fr 2fr;gap:20px;margin-top:8px}
.analise ul{margin:0;padding-left:18px}
.analise li{margin:5px 0}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible;touch-action:pan-y}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--ring);box-shadow:0 4px 16px rgba(0,0,0,.12);border-radius:8px;padding:6px 9px;font-size:12px;display:none;z-index:20;white-space:nowrap}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;border-bottom:1px solid var(--grid);padding:6px 8px}
td{border-bottom:1px solid var(--grid);padding:7px 8px;font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--neg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{border:1px solid var(--ring);background:var(--chip);color:var(--ink2);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.com{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;border-top:1px solid var(--grid);padding:12px 0}
.com:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink2)}
.com .nome{font-weight:600}
.com .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--ink2);margin-top:1px}
.stars{color:var(--warn);letter-spacing:1px;font-size:13px}
.stars .off{color:var(--grid)}
.tag{background:var(--chip);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--ink2)}
.tag.alerta{color:var(--bad)}
.txt{margin:6px 0 0;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.txt.aberto{display:block}
.lermais{border:0;background:none;color:var(--s1);padding:2px 0;font:inherit;font-size:12px;cursor:pointer}
.mais{margin-top:8px;border:1px solid var(--ring);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;width:100%}
.vazio{color:var(--muted);padding:12px 0}
@media (max-width:820px){
  .filtros{position:static}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.analise{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .wrap{padding:14px 12px 40px}
  h1{font-size:19px}
  .card{padding:12px}
  .kpi .v{font-size:24px}
  .fg{width:100%;flex-wrap:wrap}
  .hide-sm{display:none}
  td,th{padding:6px 5px}
}
@media print{.filtros{position:static}.mais,.lermais{display:none}.txt{display:block}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Rancho Texano · Avaliações no Google</h1>
    <div class="sub" id="atualizado"></div>
    <div class="aviso" id="aviso" hidden></div>
  </header>

  <div class="filtros">
    <div class="fg"><span class="lbl">Loja</span><div class="seg" id="fLoja"></div></div>
    <div class="fg"><span class="lbl">Relatório</span>
      <div class="seg" id="fPeriodo"><button data-v="anual">Anual</button><button data-v="mensal">Mensal</button><button data-v="diario">Diário</button></div>
      <select id="selAno" aria-label="Ano"></select><select id="selMes" aria-label="Mês"></select><input type="date" id="selDia" aria-label="Dia">
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="card full">
    <h2>Análise do período</h2><div class="cap" id="capAnalise"></div>
    <div class="analise"><div><h3>Diagnóstico</h3><ul id="diag"></ul></div><div><h3>Onde agir</h3><ul id="acoes"></ul></div></div>
  </div>

  <div id="graficos"></div>

  <div class="card full" id="boxComp"><h2>Comparativo entre lojas</h2><div class="cap" id="capComp"></div><div class="tw" id="comp"></div></div>

  <div class="card full"><h2>Avaliações abaixo de 4★</h2><div class="cap">Comentários para análise, do mais recente para o mais antigo</div>
    <div class="chips" id="chipsTema"></div><div id="comentarios"></div></div>
</div>
<div id="tip"></div>

<script>
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_L=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEMANA=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const NOS_DIAS=['Aos domingos','Às segundas','Às terças','Às quartas','Às quintas','Às sextas','Aos sábados'];
const SEM_C=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const ACAO={
  'Tempo de espera':'Revisar o fluxo de serviço e o tamanho da equipe nos horários de pico.',
  'Atendimento':'Treinar a equipe de salão e definir um responsável por mesa.',
  'Comida':'Revisar com a cozinha o padrão de preparo e a temperatura dos pratos. Os comentários indicam quais itens são citados.',
  'Preço':'Avaliar a percepção de custo-benefício: porções, taxa de serviço e clareza dos preços.',
  'Ambiente':'Rever barulho, climatização e espaço entre as mesas.',
  'Limpeza':'Reforçar a rotina de limpeza, principalmente dos banheiros.',
  'Delivery':'Revisar embalagem e conferência dos pedidos de entrega.'
};
let D, COR={}, S={loja:'todas',periodo:'mensal',ano:null,mes:null,dia:null,tema:'todos',limite:15};

const f1=x=>x==null||isNaN(x)?'n/d':x.toFixed(1).replace('.',',');
const f2=x=>x==null||isNaN(x)?'n/d':x.toFixed(2).replace('.',',');
const fpct=x=>x==null||isNaN(x)?'n/d':Math.round(x*100)+'%';
const fint=x=>x.toLocaleString('pt-BR');
const plural=(n,s,p)=>`${fint(n)} ${n===1?s:p}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const dataBR=iso=>{const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`};
const dow=iso=>new Date(iso+'T12:00').getDay();
const nomeLoja=id=>(D.lojas.find(l=>l.id===id)||{}).nome||id;

function sel(loja,ini,fim){return D.avaliacoes.filter(r=>(loja==='todas'||r.loja===loja)&&r.data>=ini&&r.data<=fim)}
function stats(L){
  const n=L.length, soma=L.reduce((a,r)=>a+r.nota,0), neg=L.filter(r=>r.nota<4);
  const dist=[0,0,0,0,0,0]; L.forEach(r=>dist[r.nota]++);
  const temas={}, perda={};
  neg.forEach(r=>{const ts=r.temas&&r.temas.length?r.temas:['Outros'];
    ts.forEach(t=>{temas[t]=(temas[t]||0)+1; perda[t]=(perda[t]||0)+(5-r.nota)/ts.length})});
  Object.keys(perda).forEach(t=>perda[t]/=n||1); // pontos de nota média perdidos por tema
  const semResp=neg.filter(r=>r.respondida===false).length;
  return {n,media:n?soma/n:null,negN:neg.length,pctNeg:n?neg.length/n:null,dist,temas,perda,neg,semResp};
}
function completoDesde(loja){const h=D.historico||{};let d=null;
  (loja==='todas'?D.lojas.map(l=>l.id):[loja]).forEach(id=>{const x=h[id];if(x&&!x.completo&&x.desde&&(!d||x.desde>d))d=x.desde});return d}
function periodo(){
  const maxD=D.max;
  if(S.periodo==='anual'){
    const y=S.ano, ini=`${y}-01-01`, fim=`${y}-12-31`, parcial=maxD<fim, fimEf=parcial?maxD:fim;
    return {ini,fim:fimEf,pIni:`${y-1}-01-01`,pFim:parcial?`${y-1}${fimEf.slice(4)}`:`${y-1}-12-31`,
      rot:`${y}${parcial?' (até '+dataBR(fimEf)+')':''}`,vs:parcial?`no mesmo período de ${y-1}`:`em ${y-1}`};
  }
  if(S.periodo==='mensal'){
    const [y,m]=S.mes.split('-').map(Number), ini=`${y}-${pad(m)}-01`, fim=`${y}-${pad(m)}-${pad(lastDay(y,m))}`;
    const py=m===1?y-1:y, pm=m===1?12:m-1;
    return {ini,fim:fim>maxD?maxD:fim,pIni:`${py}-${pad(pm)}-01`,pFim:`${py}-${pad(pm)}-${pad(lastDay(py,pm))}`,
      rot:`${MESES_L[m-1]} de ${y}`,vs:`em ${MESES_L[pm-1]}`};
  }
  const d=S.dia;
  return {ini:d,fim:d,pIni:addDays(d,-30),pFim:addDays(d,-1),rot:dataBR(d),vs:'na média dos 30 dias anteriores',diario:true};
}

/* ---------- tooltip (mouse e toque) ---------- */
const tip=document.getElementById('tip');
function showTip(e,html){tip.innerHTML=html;tip.style.display='block';
  const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;
  if(x+w>innerWidth-8)x=Math.max(8,e.clientX-w-14); if(y+h>innerHeight-8)y=e.clientY-h-14;
  tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.display='none'}
addEventListener('scroll',hideTip,{passive:true});
function hover(el,fn,leave){['pointermove','pointerdown'].forEach(ev=>el.addEventListener(ev,fn));el.addEventListener('pointerleave',()=>{hideTip();leave&&leave()})}
const dot=c=>`<i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${c};margin-right:5px"></i>`;

/* ---------- gráficos (SVG puro) ---------- */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function lineChart(el,{labels,series,yMin,yMax,fmt,ticks,totais}){
  const W=el.clientWidth||600,H=totais?236:220,m={l:32,r:12,t:10,b:totais?42:26},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const x=i=>m.l+(labels.length===1?iw/2:i*iw/(labels.length-1)), y=v=>m.t+ih-(v-yMin)/(yMax-yMin)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">`;
  ticks.forEach(t=>{s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${m.l-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(t)}</text>`});
  const step=Math.ceil(labels.length/(W<500?6:12));
  labels.forEach((l,i)=>{if(i%step)return;
    s+=`<text x="${x(i)}" y="${m.t+ih+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${l}</text>`;
    if(totais)s+=`<text x="${x(i)}" y="${m.t+ih+31}" text-anchor="middle" font-size="10" fill="var(--muted)">${totais[i]?fint(totais[i]):''}</text>`});
  series.forEach(se=>{let d='',pen=false;se.values.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i)+' '+y(v);pen=true});
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round"/>`;
    if(labels.length<=14)se.values.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/>`});});
  s+=`<line class="cross" y1="${m.t}" y2="${m.t+ih}" stroke="var(--axis)" visibility="hidden"/><rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  el.innerHTML=s;
  const svg=el.querySelector('svg'),cross=svg.querySelector('.cross'),r=svg.querySelector('.hit');
  hover(r,e=>{const b=svg.getBoundingClientRect();const px=(e.clientX-b.left)*W/b.width;
    const i=Math.max(0,Math.min(labels.length-1,Math.round((px-m.l)/(labels.length===1?1:iw/(labels.length-1)))));
    cross.setAttribute('x1',x(i));cross.setAttribute('x2',x(i));cross.setAttribute('visibility','visible');
    showTip(e,`<b>${labels[i]}</b><br>`+series.map(se=>`${dot(se.color)}${esc(se.name)}: <b>${fmt(se.values[i])}</b>${se.n?` <span style="color:var(--muted)">(${plural(se.n[i]||0,'avaliação','avaliações')})</span>`:''}`).join('<br>'))},
    ()=>cross.setAttribute('visibility','hidden'));
}
function stackBar(el,{labels,series,tipLabel}){
  const W=el.clientWidth||600,H=220,m={l:32,r:8,t:10,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const tot=labels.map((_,i)=>series.reduce((a,s)=>a+s.values[i],0)); const yMax=niceMax(Math.max(...tot,1));
  const bw=iw/labels.length, gap=Math.max(1,Math.min(6,bw*0.2)), y=v=>ih*v/yMax;
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">`;
  [0,yMax/2,yMax].forEach(t=>{const yy=m.t+ih-y(t);s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${m.l-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(t)}</text>`});
  const step=Math.ceil(labels.length/(W<500?8:16));
  labels.forEach((l,i)=>{let base=m.t+ih;const x0=m.l+i*bw+gap/2,w=Math.max(1,bw-gap);
    series.forEach((se,k)=>{const h=y(se.values[i]);if(h<=0)return;const top=series.slice(k+1).every(s2=>s2.values[i]===0);
      const yy=base-h,rr=top?Math.min(4,w/2,h):0;
      s+=top?`<path d="M${x0} ${base}V${yy+rr}Q${x0} ${yy} ${x0+rr} ${yy}H${x0+w-rr}Q${x0+w} ${yy} ${x0+w} ${yy+rr}V${base}Z" fill="${se.color}"/>`
            :`<rect x="${x0}" y="${yy}" width="${w}" height="${h}" fill="${se.color}"/>`;
      base=yy-(top?0:2); });
    if(i%step===0)s+=`<text x="${x0+w/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${l}</text>`;
    s+=`<rect class="hit" data-i="${i}" x="${m.l+i*bw}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"/>`;});
  s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${m.t+ih}" y2="${m.t+ih}" stroke="var(--axis)"/></svg>`;
  el.innerHTML=s;
  el.querySelectorAll('.hit').forEach(h=>{const i=+h.dataset.i;
    hover(h,e=>showTip(e,`<b>${tipLabel?tipLabel(i):labels[i]}</b><br>`+series.map(se=>`${dot(se.color)}${se.name}: <b>${se.values[i]}</b>`).join('<br>')+(series.length>1?`<br>Total: <b>${tot[i]}</b>`:'')))});
}
function legenda(items){return `<div class="legend">${items.map(([n,c])=>`<span><i style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('#fLoja button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.loja));
  document.querySelectorAll('#fPeriodo button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.periodo));
  selAno.hidden=S.periodo!=='anual'; selMes.hidden=S.periodo!=='mensal'; selDia.hidden=S.periodo!=='diario';
  const P=periodo(), L=sel(S.loja,P.ini,P.fim), c=stats(L), cd=completoDesde(S.loja);
  P.incompleto=!!(cd&&P.ini<cd); P.semBase=!!(cd&&P.pIni<cd);
  const p=P.semBase?stats([]):stats(sel(S.loja,P.pIni,P.pFim));
  renderKpis(c,p,P); renderAnalise(c,p,P,L); renderGraficos(P,L,c,p); renderComp(P); renderComentarios(c.neg);
}
function varTxt(cur,prev,{pct=false,bomQuandoSobe=true}={}){
  if(cur==null||prev==null)return '';
  const d=cur-prev, era=pct?fpct(prev):f1(prev);
  if(Math.abs(d)<(pct?0.005:0.05))return `<span>estável (era ${era})</span>`;
  const sobe=d>0, cls=(sobe===bomQuandoSobe)?'up-good':'up-bad';
  return `<span class="${cls}">${sobe?'▲':'▼'} ${pct?'':f1(Math.abs(d))+' '}</span><span>era ${era}</span>`;
}
function renderKpis(c,p,P){
  const comp=P.semBase?'Sem comparação (histórico carregando)':'';
  const volPrev=P.diario?p.n/30:p.n;
  const volTxt=comp||(p.n?`${P.diario?'média de '+f1(volPrev)+' por dia':'eram '+fint(p.n)} ${P.vs}`:'');
  kpis.innerHTML=`
   <div class="card kpi"><div class="k">Avaliações · ${P.rot}</div><div class="v">${fint(c.n)}</div><div class="d">${volTxt}</div></div>
   <div class="card kpi"><div class="k">Nota média</div><div class="v">${f1(c.media)} <span style="font-size:.65em;color:var(--warn)">★</span></div>
     <div class="d">em ${plural(c.n,'avaliação','avaliações')}</div><div class="d">${comp||varTxt(c.media,p.media)+' '+P.vs}</div></div>
   <div class="card kpi"><div class="k">Abaixo de 4★</div><div class="v">${fpct(c.pctNeg)}</div>
     <div class="d">${plural(c.negN,'avaliação','avaliações')}, ${c.neg.filter(r=>r.nota<=2).length} com 1 ou 2★</div><div class="d">${comp||varTxt(c.pctNeg,p.pctNeg,{pct:true,bomQuandoSobe:false})+' '+P.vs}</div></div>
   <div class="card kpi"><div class="k">Negativas sem resposta da loja</div><div class="v">${fint(c.semResp)}</div>
     <div class="d">${c.negN?`${fpct(c.semResp/c.negN)} das ${plural(c.negN,'avaliação','avaliações')} abaixo de 4★`:'nenhuma avaliação abaixo de 4★'}</div></div>`;
}
function topPor(obj){const e=Object.entries(obj).filter(([t])=>t!=='Outros').sort((a,b)=>b[1]-a[1]);return e[0]||null}
function renderAnalise(c,p,P,L){
  const diag=[], acoes=[];
  capAnalise.textContent=`${S.loja==='todas'?'Todas as lojas':nomeLoja(S.loja)} · ${P.rot}`;
  if(!c.n){diag.push('Nenhuma avaliação neste período.');diagEl(diag,acoes);return}
  if(P.incompleto)diag.push(`<b>Dados parciais:</b> o histórico ainda está sendo carregado e este período só está completo a partir de ${dataBR(completoDesde(S.loja))}.`);
  if(c.n<30&&!P.diario)diag.push(`Amostra pequena (${plural(c.n,'avaliação','avaliações')}): uma ou duas avaliações mudam bastante os percentuais.`);

  // nota e tendência
  if(p.media!=null){const d=c.media-p.media;
    diag.push(Math.abs(d)<0.05?`Nota média estável em <b>${f1(c.media)}</b> (era ${f1(p.media)} ${P.vs}).`
      :`Nota média ${d>0?'subiu':'caiu'} de ${f1(p.media)} ${P.vs} para <b>${f1(c.media)}</b>.`)}
  else diag.push(`Nota média de <b>${f1(c.media)}</b> em ${plural(c.n,'avaliação','avaliações')}.`);

  // maior impacto na nota
  const tp=topPor(c.perda);
  if(tp&&c.negN){const mencoes=c.temas[tp[0]], share=mencoes/c.negN;
    diag.push(`<b>${tp[0]}</b> é o problema que mais pesa: aparece em ${fpct(share)} das notas baixas e tira <b>${f2(tp[1])}</b> ponto da nota média. Sem essas reclamações, a nota iria de ${f1(c.media)} para ${f1(c.media+tp[1])}.`);
    if(ACAO[tp[0]])acoes.push(`<b>${tp[0]}:</b> ${ACAO[tp[0]]}`);
    const seg=Object.entries(c.perda).filter(([t])=>t!=='Outros'&&t!==tp[0]).sort((a,b)=>b[1]-a[1])[0];
    if(seg&&seg[1]>=0.05&&ACAO[seg[0]]){diag.push(`Em seguida vem <b>${seg[0].toLowerCase()}</b>, que tira ${f2(seg[1])} ponto.`);acoes.push(`<b>${seg[0]}:</b> ${ACAO[seg[0]]}`)}
    if(!P.semBase&&p.n&&!P.diario&&c.negN>=10&&p.negN>=10){
      const cres=Object.keys(c.temas).filter(t=>t!=='Outros').map(t=>[t,(c.temas[t]/c.negN)-((p.temas[t]||0)/(p.negN||1)),c.temas[t]]).filter(x=>x[2]>=4).sort((a,b)=>b[1]-a[1])[0];
      if(cres&&cres[1]>=0.10)diag.push(`<b>${cres[0]}</b> ganhou espaço: passou de ${fpct((p.temas[cres[0]]||0)/(p.negN||1))} das reclamações ${P.vs} para ${fpct(c.temas[cres[0]]/c.negN)}.`);
    }
  }
  // gravidade
  if(c.negN>=5){const um=c.neg.filter(r=>r.nota===1).length/c.negN;
    if(um>=0.4)diag.push(`${fpct(um)} das notas baixas são de 1★: é insatisfação forte, não ressalva pontual.`)}
  // dia da semana (taxa, não contagem)
  if(!P.diario&&c.n>=40){const tot=Array(7).fill(0),neg=Array(7).fill(0);L.forEach(r=>{const w=dow(r.data);tot[w]++;if(r.nota<4)neg[w]++});
    const taxas=tot.map((t,i)=>t>=10?[i,neg[i]/t,t]:null).filter(Boolean).sort((a,b)=>b[1]-a[1]);
    if(taxas.length&&taxas[0][1]>=c.pctNeg*1.3&&taxas[0][1]-c.pctNeg>=0.04){const [w,t]=taxas[0];
      diag.push(`<b>${NOS_DIAS[w]}</b>, ${fpct(t)} das avaliações são abaixo de 4★, contra ${fpct(c.pctNeg)} na média do período.`);
      acoes.push(`<b>${SEMANA[w][0].toUpperCase()+SEMANA[w].slice(1)}:</b> verificar escala, reposição e fluxo nesse dia, que concentra a maior taxa de insatisfação.`)}}
  // comparação entre lojas
  if(S.loja==='todas'&&!P.diario){const por=D.lojas.map(l=>({l,s:stats(L.filter(r=>r.loja===l.id))})).filter(x=>x.s.n>=10);
    if(por.length>1){por.sort((a,b)=>a.s.media-b.s.media);const w=por[0],b=por[por.length-1];
      if(b.s.media-w.s.media>=0.1){const tw=topPor(w.s.perda);
        diag.push(`<b>${esc(w.l.nome)}</b> tem a menor nota (${f1(w.s.media)}) e <b>${esc(b.l.nome)}</b> a maior (${f1(b.s.media)})${tw?`. Em ${esc(w.l.nome)}, o que mais pesa é ${tw[0].toLowerCase()}`:''}.`)}}}
  if(S.loja!=='todas'&&!P.diario&&c.negN>=10){
    const outros=stats(sel('todas',P.ini,P.fim).filter(r=>r.loja!==S.loja));
    if(outros.negN>=5){const lift=Object.keys(c.temas).filter(t=>t!=='Outros'&&c.temas[t]>=3).map(t=>[t,(c.temas[t]/c.negN)/(((outros.temas[t]||0)+0.5)/outros.negN)]).sort((a,b)=>b[1]-a[1])[0];
      if(lift&&lift[1]>=1.5)diag.push(`<b>${lift[0]}</b> é proporcionalmente ${f1(lift[1])}x mais citado aqui do que nas outras lojas: é um problema específico desta unidade.`)}}
  // resposta
  if(c.negN){if(c.semResp)acoes.unshift(`<b>Responder avaliações:</b> ${plural(c.semResp,'avaliação negativa está','avaliações negativas estão')} sem resposta da loja. Responder, começando pelas de 1★ mais recentes, mostra cuidado para quem lê.`);
    if(c.semResp===c.negN)diag.push(`Nenhuma avaliação negativa teve resposta da loja.`);else if(c.semResp/c.negN>=0.8)diag.push(`Só ${fpct(1-c.semResp/c.negN)} das avaliações negativas tiveram resposta da loja.`)}
  if(!acoes.length)acoes.push('Nenhuma ação prioritária identificada neste período.');
  diagEl(diag,acoes);
}
function diagEl(d,a){diag.innerHTML=d.map(t=>`<li>${t}</li>`).join('');acoes.innerHTML=a.map(t=>`<li>${t}</li>`).join('')}

function renderGraficos(P,L,c,p){
  const lojas=S.loja==='todas'?D.lojas.map(l=>l.id):[S.loja];
  if(P.diario){
    graficos.innerHTML=`<div class="grid2"><div class="card"><h2>Distribuição de estrelas</h2><div class="cap">${P.rot}</div><div class="tw" id="gDist"></div></div>
       <div class="card"><h2>Temas das notas baixas</h2><div class="cap">${P.rot}</div><div class="tw" id="gTemas"></div></div></div>`;
    distTable(gDist,c); temasTable(gTemas,c,p,true); return;
  }
  const leg=lojas.length>1?legenda(lojas.map(id=>[nomeLoja(id),COR[id]])):'';
  const legVol=legenda([['4★ ou mais','var(--pos)'],['Abaixo de 4★','var(--neg)']]);
  let h=S.periodo==='anual'
    ?`<div class="grid2"><div class="card"><h2>Nota média por mês</h2><div class="cap">${P.rot}. Abaixo do eixo, a quantidade de avaliações do mês</div>${leg}<div class="chart" id="gNota"></div></div>
       <div class="card"><h2>Avaliações por mês</h2><div class="cap">${P.rot}</div>${legVol}<div class="chart" id="gVol"></div></div></div>`
    :`<div class="grid2"><div class="card"><h2>Avaliações por dia</h2><div class="cap">${P.rot}</div>${legVol}<div class="chart" id="gVol"></div></div>
       <div class="card"><h2>Nota média nos últimos 12 meses</h2><div class="cap">Abaixo do eixo, a quantidade de avaliações do mês</div>${leg}<div class="chart" id="gNota"></div></div></div>`;
  h+=`<div class="grid2"><div class="card"><h2>Temas das notas baixas</h2><div class="cap">Menções e quanto cada tema tira da nota média</div><div class="tw" id="gTemas"></div></div>
      <div class="card"><h2>Taxa de notas baixas por dia da semana</h2><div class="cap">% das avaliações do dia que ficaram abaixo de 4★</div><div class="chart" id="gSemana"></div></div></div>`;
  graficos.innerHTML=h;

  let meses=[];
  if(S.periodo==='anual'){const ult=+P.fim.slice(5,7);for(let m=1;m<=ult;m++)meses.push(`${S.ano}-${pad(m)}`)}
  else{let [y,m]=S.mes.split('-').map(Number);for(let k=11;k>=0;k--){let mm=m-k,yy=y;while(mm<1){mm+=12;yy--}meses.push(`${yy}-${pad(mm)}`)}}
  meses=meses.filter(x=>x>=D.min.slice(0,7));
  const labM=meses.map(x=>MESES[+x.slice(5)-1]+(S.periodo==='anual'?'':'/'+x.slice(2,4)));
  const ser=lojas.map(id=>{const st=meses.map(mm=>stats(sel(id,mm+'-01',mm+'-31')));return {name:nomeLoja(id),color:COR[id],values:st.map(s=>s.media),n:st.map(s=>s.n)}});
  const totais=meses.map((_,i)=>ser.reduce((a,s)=>a+s.n[i],0));
  const all=ser.flatMap(s=>s.values).filter(v=>v!=null);const lo=all.length?Math.max(1,Math.floor((Math.min(...all)-0.1)*2)/2):3,hi=5;
  const tk=[];for(let t=lo;t<=hi+1e-9;t+=0.5)tk.push(t);
  lineChart(gNota,{labels:labM,series:ser,yMin:lo,yMax:hi,fmt:f1,ticks:tk,totais});

  if(S.periodo==='anual'){
    stackBar(gVol,{labels:meses.map(x=>MESES[+x.slice(5)-1]),series:[
      {name:'4★ ou mais',color:'var(--pos)',values:meses.map(mm=>L.filter(r=>r.data.startsWith(mm)&&r.nota>=4).length)},
      {name:'Abaixo de 4★',color:'var(--neg)',values:meses.map(mm=>L.filter(r=>r.data.startsWith(mm)&&r.nota<4).length)}],
      tipLabel:i=>MESES_L[+meses[i].slice(5)-1]});
  } else {
    const [y,m]=S.mes.split('-').map(Number), dias=[];for(let d=1;d<=lastDay(y,m);d++)dias.push(`${S.mes}-${pad(d)}`);
    stackBar(gVol,{labels:dias.map(d=>String(+d.slice(8))),series:[
      {name:'4★ ou mais',color:'var(--pos)',values:dias.map(d=>L.filter(r=>r.data===d&&r.nota>=4).length)},
      {name:'Abaixo de 4★',color:'var(--neg)',values:dias.map(d=>L.filter(r=>r.data===d&&r.nota<4).length)}],
      tipLabel:i=>`${SEM_C[dow(dias[i])]}, ${dataBR(dias[i])}`});
  }
  temasTable(gTemas,c,p,false);
  const tot=Array(7).fill(0),neg=Array(7).fill(0);L.forEach(r=>{const w=dow(r.data);tot[w]++;if(r.nota<4)neg[w]++});
  const ord=[1,2,3,4,5,6,0];
  stackBar(gSemana,{labels:ord.map(i=>SEM_C[i]),series:[{name:'Abaixo de 4★',color:'var(--neg)',values:ord.map(i=>tot[i]?Math.round(neg[i]/tot[i]*100):0)}],
    tipLabel:i=>`${SEMANA[ord[i]]}: ${neg[ord[i]]} de ${tot[ord[i]]} avaliações (%)`});
}
function temasTable(el,c,p,diario){
  const e=Object.entries(c.temas).sort((a,b)=>(c.perda[b[0]]||0)-(c.perda[a[0]]||0));
  if(!e.length){el.innerHTML='<div class="vazio">Nenhuma nota baixa neste período.</div>';return}
  const mx=Math.max(...e.map(([t])=>c.perda[t]||0))||1, comp=!diario&&p.n;
  el.innerHTML=`<table><tr><th>Tema</th><th class="hide-sm"></th><th class="num hide-sm">Menções</th><th class="num">% das notas baixas</th><th class="num">Tira da nota</th>${comp?'<th class="num hide-sm">Antes</th>':''}</tr>`+
   e.map(([t,n])=>{const pv=p.temas[t]||0;
     return `<tr><td>${t}</td><td class="hide-sm" style="width:22%"><div class="bar" style="width:${(c.perda[t]||0)/mx*100}%"></div></td><td class="num hide-sm">${n}</td><td class="num">${fpct(n/c.negN)}</td><td class="num">${f2(c.perda[t])}</td>${comp?`<td class="num hide-sm">${pv}</td>`:''}</tr>`}).join('')+`</table>`;
}
function distTable(el,c){
  const mx=Math.max(...c.dist.slice(1),1);
  el.innerHTML=`<table>${[5,4,3,2,1].map(k=>`<tr><td style="width:40px">${k}★</td><td><div class="bar" style="background:${k>=4?'var(--pos)':'var(--neg)'};width:${c.dist[k]/mx*100}%"></div></td><td class="num" style="width:40px">${c.dist[k]}</td></tr>`).join('')}</table>`;
}
function renderComp(P){
  if(S.loja!=='todas'){boxComp.hidden=true;return} boxComp.hidden=false;
  capComp.textContent=P.rot;
  const rows=D.lojas.map(l=>{const c=stats(sel(l.id,P.ini,P.fim)),cdl=completoDesde(l.id),p=(cdl&&P.pIni<cdl)?stats([]):stats(sel(l.id,P.pIni,P.pFim)),t=topPor(c.perda);
    const v=(c.media!=null&&p.media!=null)?varTxt(c.media,p.media):'<span style="color:var(--muted)">sem base</span>';
    return `<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${COR[l.id]};margin-right:6px"></i>${esc(l.nome)}</td><td class="num">${fint(c.n)}</td><td class="num">${f1(c.media)}</td><td class="num hide-sm">${v}</td><td class="num">${fpct(c.pctNeg)}</td><td class="num hide-sm">${c.semResp}</td><td class="hide-sm">${t?t[0]:'n/d'}</td></tr>`}).join('');
  comp.innerHTML=`<table><tr><th>Loja</th><th class="num">Avaliações</th><th class="num">Nota</th><th class="num hide-sm">Variação</th><th class="num">Abaixo de 4★</th><th class="num hide-sm">Sem resposta</th><th class="hide-sm">Maior problema</th></tr>${rows}</table>`;
}
function iniciais(n){return (n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join('')}
function renderComentarios(neg){
  const temas=[...new Set(neg.flatMap(r=>r.temas||[]))].sort();
  if(S.tema!=='todos'&&!temas.includes(S.tema))S.tema='todos';
  chipsTema.innerHTML=[`<button class="chip" data-t="todos" aria-pressed="${S.tema==='todos'}">Todos (${neg.length})</button>`]
    .concat(temas.map(t=>`<button class="chip" data-t="${esc(t)}" aria-pressed="${S.tema===t}">${esc(t)} (${neg.filter(r=>(r.temas||[]).includes(t)).length})</button>`)).join('');
  chipsTema.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tema=b.dataset.t;S.limite=15;renderComentarios(neg)});
  const lista=neg.filter(r=>S.tema==='todos'||(r.temas||[]).includes(S.tema)).sort((a,b)=>b.data.localeCompare(a.data)||a.nota-b.nota);
  if(!lista.length){comentarios.innerHTML='<div class="vazio">Nenhuma avaliação abaixo de 4★ neste período.</div>';return}
  comentarios.innerHTML=lista.slice(0,S.limite).map(r=>{
    const nome=r.autor||'Cliente do Google';
    const av=r.foto?`<img class="av" src="${esc(r.foto)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;av&quot;>${esc(iniciais(nome))}</div>'">`:`<div class="av">${esc(iniciais(nome))}</div>`;
    return `<div class="com">${av}<div><div class="nome">${esc(nome)}</div>
      <div class="meta"><span class="stars" aria-label="${r.nota} estrelas">${'★'.repeat(r.nota)}<span class="off">${'★'.repeat(5-r.nota)}</span></span>
      <span>${esc(nomeLoja(r.loja))}</span><span>${dataBR(r.data)}</span>${(r.temas||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${r.respondida===false?'<span class="tag alerta">Sem resposta</span>':''}</div>
      ${r.comentario?`<p class="txt">${esc(r.comentario)}</p><button class="lermais" hidden>Ler mais</button>`:'<p class="txt" style="color:var(--muted)">Avaliação sem comentário.</p>'}</div></div>`}).join('')+
    (lista.length>S.limite?`<button class="mais" id="btnMais">Mostrar mais (${lista.length-S.limite} restantes)</button>`:'');
  comentarios.querySelectorAll('.txt').forEach(p=>{const b=p.nextElementSibling;if(b&&b.classList.contains('lermais')&&p.scrollHeight>p.clientHeight+2){b.hidden=false;
    b.onclick=()=>{const ab=p.classList.toggle('aberto');b.textContent=ab?'Ler menos':'Ler mais'}}});
  const bm=document.getElementById('btnMais'); if(bm)bm.onclick=()=>{S.limite+=30;renderComentarios(neg)};
}

/* ---------- início ---------- */
async function carregar(){
  if(window.DADOS)return window.DADOS;
  const r=await fetch('dados.json',{cache:'no-store'});return r.json();
}
carregar().then(dados=>{
  D=dados; D.lojas.forEach((l,i)=>COR[l.id]=`var(--s${i%3+1})`);
  if(!D.avaliacoes||!D.avaliacoes.length){document.querySelectorAll('.filtros,.kpis,.card,#graficos').forEach(c=>c.hidden=true);
    document.querySelector('.wrap').insertAdjacentHTML('beforeend','<div class="card"><h2>Aguardando a primeira coleta</h2></div>');atualizado.textContent=D.lojas.map(l=>l.nome).join(' · ');return}
  const datas=D.avaliacoes.map(r=>r.data).sort(); D.min=datas[0]; D.max=datas[datas.length-1];
  const at=new Date(D.atualizado_em);
  atualizado.textContent=`${D.lojas.map(l=>l.nome).join(' · ')}. Atualizado em ${at.toLocaleDateString('pt-BR')} às ${at.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}, com avaliações até ${dataBR(D.max)}.`;
  const cd=completoDesde('todas');
  if(cd){aviso.hidden=false;aviso.textContent=`Histórico ainda sendo carregado, um pouco por dia. Os dados estão completos a partir de ${dataBR(cd)}.`}
  fLoja.innerHTML=`<button data-v="todas">Todas</button>`+D.lojas.map(l=>`<button data-v="${l.id}">${esc(l.nome)}</button>`).join('');
  const anos=[...new Set(datas.map(d=>+d.slice(0,4)))].sort((a,b)=>b-a);
  selAno.innerHTML=anos.map(a=>`<option>${a}</option>`).join('');
  const meses=[...new Set(datas.map(d=>d.slice(0,7)))].sort().reverse();
  selMes.innerHTML=meses.map(m=>`<option value="${m}">${MESES_L[+m.slice(5)-1]} de ${m.slice(0,4)}</option>`).join('');
  selDia.min=D.min; selDia.max=D.max;
  S.ano=anos[0]; S.dia=D.max;
  S.mes=D.max.slice(8)===String(lastDay(+D.max.slice(0,4),+D.max.slice(5,7)))?meses[0]:(meses[1]||meses[0]);
  selMes.value=S.mes; selDia.value=S.dia;
  fLoja.onclick=e=>{const b=e.target.closest('button');if(b){S.loja=b.dataset.v;S.limite=15;render()}};
  fPeriodo.onclick=e=>{const b=e.target.closest('button');if(b){S.periodo=b.dataset.v;S.limite=15;render()}};
  selAno.onchange=()=>{S.ano=+selAno.value;render()}; selMes.onchange=()=>{S.mes=selMes.value;render()};
  selDia.onchange=()=>{if(selDia.value){S.dia=selDia.value;render()}};
  let t,w=innerWidth;addEventListener('resize',()=>{if(innerWidth===w)return;w=innerWidth;clearTimeout(t);t=setTimeout(render,150)});
  render();
}).catch(e=>{document.querySelector('.wrap').insertAdjacentHTML('beforeend',`<div class="card">Não foi possível carregar os dados (${esc(e.message)}).</div>`)});
</script>
